<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>啊巴啊巴(～o￣3￣)～</title>
  <meta name="description" content="个人主页：图片墙、上传与设置，一个安静的私人空间。">
  <link rel="icon" href="/assets/img/favicon.svg">

  <!--
    字体在小米官方 CDN 上（MiSans 的 woff2 切片）。
    提前建连，等 JS 那边异步拉字体时就不用再花一次握手时间。
    crossorigin 是因为字体请求走 CORS（对方返回了 Access-Control-Allow-Origin: *）。
  -->
  <link rel="preconnect" href="https://cdn-file.hyperos.mi.com" crossorigin>

  <!--
    样式不在这里引：它由 src/main.js 通过 import 引入，
    构建后 Vite 会自动往 <head> 注入 <link>，且文件名带 hash。
  -->

  <!--
    首帧初始化：赶在浏览器画第一帧前决定明暗、侧栏状态和强调色，避免闪烁。
    下面这个外链标签只是「占位」——构建（和 dev）时会被 vite.config.js 的
    inlineBootTheme 插件替换成 src/boot-theme.js 的内联内容，
    这样首屏不必为了一个 2.8KB 的小文件多跑一个跨境往返。
    内联后 CSP 仍不放宽：script-src 里写的是这份脚本的 sha256，由构建期写入。
  -->
  <script src="/assets/js/boot-theme.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
