<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图墙 · 瓜の居酒屋</title>
  <meta name="description" content="图片墙：所有图片都在这里。">
  <link rel="icon" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/site.config.js"></script>
  <script src="assets/js/theme-init.js"></script>
</head>
<body data-page="wall" data-title="图墙" data-desc="所有图片都在这里">

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content">

        <!-- ============================================================
             ▼▼▼ 工具栏：筛选、排序、视图切换 ▼▼▼
             逻辑在 assets/js/page-wall.js 里，按你的需求改就行。
             ============================================================ -->
        <!-- 后端连接状态提示，内容由 page-wall.js 填写 -->
        <div class="notice" id="wallNotice" hidden></div>

        <div class="wall-toolbar">
          <div class="seg" id="filterSeg">
            <button type="button" class="is-active" data-filter="all">全部</button>
            <button type="button" data-filter="fav">收藏</button>
            <button type="button" data-filter="recent">最近</button>
          </div>

          <select class="select" id="sortSelect" style="width:auto">
            <option value="new">最新上传</option>
            <option value="old">最早上传</option>
            <option value="name">按名称</option>
          </select>

          <span class="spacer"></span>

          <button class="btn" type="button" id="clearFilterBtn">清除筛选</button>
          <a class="btn btn--primary" href="upload.html">＋ 上传图片</a>
        </div>

        <!-- 当前筛选条件提示（搜索时出现） -->
        <p class="muted" id="filterHint" style="margin:-4px 0 14px;display:none"></p>

        <!-- ============================================================
             ▼▼▼ 图片墙本体：由 page-wall.js 动态渲染 ▼▼▼
             想手工写死几张图？照着下面结构复制即可：

             <a class="wall__item" href="assets/img/your.jpg" data-full="assets/img/your.jpg">
               <img class="wall__thumb" src="assets/img/your.jpg" alt="说明">
               <div class="wall__meta">
                 <div class="wall__name">图片标题</div>
                 <div class="wall__sub">2026-01-01 · 标签</div>
               </div>
             </a>
             ============================================================ -->
        <section class="wall" id="wall">
          <!-- 静态示例（可删）：把 src 换成你自己的图片路径 -->
          <div class="wall__item" data-demo="1">
            <div class="wall__thumb wall__thumb--empty">🖼</div>
            <div class="wall__meta">
              <div class="wall__name">示例卡片 1</div>
              <div class="wall__sub">图片墙占位 · 点「上传」替换</div>
            </div>
          </div>
          <div class="wall__item" data-demo="1">
            <div class="wall__thumb wall__thumb--empty" style="aspect-ratio:3/4">🖼</div>
            <div class="wall__meta">
              <div class="wall__name">示例卡片 2</div>
              <div class="wall__sub">高度随图片自动变化</div>
            </div>
          </div>
          <div class="wall__item" data-demo="1">
            <div class="wall__thumb wall__thumb--empty" style="aspect-ratio:16/9">🖼</div>
            <div class="wall__meta">
              <div class="wall__name">示例卡片 3</div>
              <div class="wall__sub">瀑布流布局</div>
            </div>
          </div>

          <!-- 末尾的「添加」大按钮 -->
          <a class="wall__add" href="upload.html">
            <span style="font-size:26px">＋</span>
            <span>添加新图片</span>
          </a>
        </section>

        <!-- 空状态（没有图片时显示，默认藏起来） -->
        <div class="placeholder" id="wallEmpty" hidden>
          <div class="placeholder__title">图墙还是空的</div>
          <div>去「上传」页添加图片；或把你的图片放进 <code>assets/img/</code>，再在 <code>assets/js/page-wall.js</code> 的 <code>DEMO_ITEMS</code> 里登记。</div>
          <div style="margin-top:16px"><a class="btn btn--primary" href="upload.html">开始上传</a></div>
        </div>

      </main>

      <footer class="footer" id="footer"></footer>
    </div>
  </div>

  <!-- 灯箱：点图片放大查看 -->
  <div class="lightbox" id="lightbox">
    <button class="icon-btn lightbox__close" id="lightboxClose" type="button">✕</button>
    <div>
      <img class="lightbox__img" id="lightboxImg" alt="">
      <div class="lightbox__bar">
        <span id="lightboxCaption">—</span>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/page-wall.js"></script>
</body>
</html>
